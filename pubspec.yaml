name: equinox_flood
description: OpsFlood — Real-time Bihar flood monitoring app
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  html: ^0.15.4
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_tts: ^4.0.2
  vibration: ^1.8.4
  postgres: ^3.5.3
  flutter_secure_storage: ^9.0.0

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & parsing
  http: ^1.2.0
  xml: ^6.3.0

  # WebSocket real-time pipeline
  web_socket_channel: ^3.0.1

  # State management
  flutter_riverpod: ^2.6.1
  provider: ^6.1.2

  # Config
  flutter_dotenv: ^6.0.1

  # Firebase suite — pinned to latest stable (June 2026)
  firebase_auth:         ^5.5.3
  firebase_messaging:    ^15.2.5
  firebase_performance:  ^0.10.0+8
  cloud_firestore:       ^5.6.9
  firebase_storage:      ^12.4.5

  # Background tasks
  workmanager: ^0.9.0+3

  # Charts
  fl_chart: ^0.69.0

  # Storage & prefs
  shared_preferences: ^2.3.0

  # Routing
  go_router: ^14.2.0


  # i18n
  intl: ^0.20.2

  # Links
  url_launcher: ^6.3.0

  # Local notifications
  flutter_local_notifications: ^17.2.4

  # Network status
  connectivity_plus: ^7.1.1

  # Ads
  google_mobile_ads: ^4.0.0

  # Icons
  cupertino_icons: ^1.0.6

  # Sharing
  share_plus: ^10.1.4

  # App version info
  package_info_plus: ^8.1.3

  # Branding & Icons
  flutter_svg: ^2.0.10

  # Maps
  flutter_map: ^8.1.1
  latlong2:    ^0.9.1

  # Hive runtime
  hive:         ^2.2.3
  hive_flutter: ^1.1.0
  uuid:         ^4.4.2

  # Media, Image Attachments & Export
  image_picker:  ^1.1.2
  pdf:           ^3.10.8
  csv:           ^6.0.0
  path_provider: ^2.1.4
  excel:         ^4.0.6

  # GPS
  geolocator: ^13.0.4

  # Timestamps
  timeago: ^3.7.0
  home_widget: ^0.9.3
  firebase_crashlytics: ^4.3.10
  firebase_core: ^3.15.2
  dio: ^5.10.0
  path: ^1.9.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  json_serializable: ^6.7.1
  freezed: ^2.4.7


  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

  # Mocking (Module 6 widget + unit tests)
  mockito:       ^5.4.4
  build_runner:  ^2.4.9

  # Golden pixel-comparison tests (Module 6 Step 6.3)
  golden_toolkit: ^0.15.0

  # Build tooling
  flutter_launcher_icons:  ^0.14.4
  flutter_native_splash:   ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/opsflood_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#0d1b2a"
  adaptive_icon_foreground: assets/icon/opsflood_icon.png

flutter_native_splash:
  color: "#0d1b2a"
  color_dark: "#0d1b2a"
  image: assets/splash/opsflood_splash_logo.png
  image_dark: assets/splash/opsflood_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0d1b2a"
    color_dark: "#0d1b2a"
    image: assets/splash/opsflood_splash_logo.png
    image_dark: assets/splash/opsflood_splash_logo.png
    icon_background_color: "#0d1b2a"
    icon_background_color_dark: "#0d1b2a"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
    - assets/fonts/
    - assets/icons/
    - assets/splash/
    - assets/data/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
