name: equinox_flood
description: OpsFlood — Real-time Bihar flood monitoring app
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  html: ^0.15.4

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & parsing
  http: ^1.2.0
  xml: ^6.3.0

  # State management
  flutter_riverpod: ^3.3.1

  # Config
  flutter_dotenv: ^6.0.1

  # Firebase suite
  firebase_core:         ^4.9.0
  firebase_auth:         ^6.5.2
  firebase_messaging:    ^16.2.2
  firebase_crashlytics:  ^5.2.3
  cloud_firestore:       ^6.4.1
  firebase_storage:      ^13.0.2

  # Background tasks
  # flutter_background_service REMOVED: conflicts with workmanager on Android 12+
  # (ForegroundServiceStartNotAllowedException). All background work is handled
  # exclusively by WorkManager via ai_prediction_background_service.dart.
  # See lib/services/background_service.dart for the no-op shim + explanation.
  workmanager: ^0.9.0+3

  # Charts
  fl_chart: ^1.2.0

  # Storage & prefs
  shared_preferences: ^2.3.0

  # i18n
  intl: ^0.20.2

  # Links
  url_launcher: ^6.3.0

  # Local notifications
  flutter_local_notifications: ^17.2.4

  # Network status
  connectivity_plus: ^7.1.1

  # Ads
  google_mobile_ads: ^4.0.0

  # Icons
  cupertino_icons: ^1.0.6

  # Sharing
  share_plus: ^10.1.0

  # App version info
  package_info_plus: ^8.1.3

  # Branding & Icons
  flutter_svg: ^2.0.10

  # Maps
  flutter_map: ^8.1.1
  latlong2:    ^0.9.1

  # Hive runtime
  hive:         ^2.2.3
  hive_flutter: ^1.1.0
  uuid:         ^4.4.2

  # Media, Image Attachments & Export
  image_picker:  ^1.1.2
  pdf:           ^3.10.8
  csv:           ^6.0.0
  path_provider: ^2.1.4
  # syncfusion_flutter_xlsio removed: incompatible with Dart 3.12 analyzer chain.
  # Replaced with excel (pure-Dart, no conflict):
  excel: ^4.0.6

  # GPS
  geolocator: ^13.0.4

  # Timestamps
  timeago: ^3.7.0

  # Home screen widget
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  # hive_generator + build_runner REMOVED — version conflict:
  #   hive_generator ^2.0.1 needs analyzer >=4.6.0 <7.0.0
  #   build_runner ^2.4.9 + flutter_riverpod ^3.3.1 need analyzer >=8.x
  # Solution: commit generated .g.dart files directly to the repo.
  # To regenerate on a separate Dart 2.x toolchain:
  #   dart pub global activate build_runner
  #   dart pub global activate hive_generator
  #   dart run build_runner build --delete-conflicting-outputs

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/opsflood_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#0d1b2a"
  adaptive_icon_foreground: assets/icon/opsflood_icon.png

flutter_native_splash:
  color: "#0d1b2a"
  color_dark: "#0d1b2a"
  image: assets/splash/opsflood_splash_logo.png
  image_dark: assets/splash/opsflood_splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0d1b2a"
    color_dark: "#0d1b2a"
    image: assets/splash/opsflood_splash_logo.png
    image_dark: assets/splash/opsflood_splash_logo.png
    icon_background_color: "#0d1b2a"
    icon_background_color_dark: "#0d1b2a"

flutter:
  uses-material-design: true
  generate: true

  assets:
    # .env intentionally NOT listed here.
    # Reason: bundling .env as a Flutter asset makes its contents readable
    # by anyone who decompiles the APK with apktool.
    # All secrets are server-side (Railway/Render). Only non-secret config
    # lives in lib/config/app_config.dart via --dart-define at build time.
    - assets/icon/
    - assets/fonts/
    - assets/icons/
    - assets/splash/
    - assets/data/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
