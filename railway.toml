# railway.toml  — Step 2.6
# Railway deployment config for OpsFlood backend.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand   = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.envVars]
# Set these as Railway secret variables in the dashboard:
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_FROM_NUMBER
# IMD_API_KEY  (optional, for future rainfall overlay)
