# analysis_options.yaml
#
# Strategy:
#   • Hard errors (UNDEFINED_*, MISSING_REQUIRED_ARGUMENT, URI_DOES_NOT_EXIST,
#     UNDEFINED_CLASS, etc.) stay as errors — they block compilation.
#   • Pure style / const / deprecation lints are downgraded to `ignore` for
#     now so `dart analyze` output is signal, not noise.  Run
#     `dart fix --apply` locally to bulk-resolve unused_import and
#     prefer_const_constructors automatically.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # ── Deprecations: withOpacity → withValues, etc. (250 hits) ──────────────
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore

    # ── Unused imports (38 hits — dart fix --apply resolves all) ────────────
    unused_import: ignore

    # ── Null-aware style (17+6+8 hits) ───────────────────────────────────
    dead_null_aware_expression: ignore
    unnecessary_null_comparison: ignore
    unnecessary_non_null_assertion: ignore

linter:
  rules:
    # ── Const / style rules (130 + 13 + 9 + 22 + 7 hits) ──────────────────
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    curly_braces_in_flow_control_structures: false
    no_leading_underscores_for_local_identifiers: false

    # ── Commonly toggled rules ──────────────────────────────────────────
    avoid_print: false          # debug prints fine during active development
    prefer_single_quotes: false # keep double-quote style consistent

    # ── Keep these ON (they surface real bugs) ───────────────────────────
    # avoid_dynamic_calls: true      # uncomment to enforce type safety
    # always_use_package_imports: true
