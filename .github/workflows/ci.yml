# .github/workflows/ci.yml  Step 7.1
# Runs on every pull_request and push to main.
# Jobs:
#   1. analyze   — dart format check + flutter analyze
#   2. unit      — flutter test (unit + widget) with coverage
#   3. goldens   — golden pixel-comparison tests

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:

  # ─────────────────────────────────────────────────────
  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n + mocks
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

  # ──────────────────────────────────────────────────────
  unit:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n + mocks
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: |
          flutter test \
            --coverage \
            --exclude-tags golden \
            --reporter expanded

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/lcov.info
          fail_ci_if_error: false

      - name: Coverage gate (>= 60%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 \
            | grep 'lines' | grep -oP '[0-9.]+(?=%)' | head -1)
          echo "Coverage: ${COVERAGE}%"
          python3 -c "import sys; v=float('${COVERAGE}'); sys.exit(0 if v>=60 else 1)"

  # ──────────────────────────────────────────────────────
  goldens:
    name: Golden Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n + mocks
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Run golden tests
        run: flutter test --tags golden test/golden/

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          retention-days: 7
