# .github/workflows/release.yml
# Phase 4 — Full CI/CD Pipeline for OpsFlood Production Release
# Triggers: push to main OR manual workflow_dispatch
# Steps: analyze → test → build release AAB → (optional) upload to Play Store

name: OpsFlood Production Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_play_store:
        description: 'Deploy to Play Store internal track'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env for CI
        run: |
          echo "# CI stub .env" > .env
          echo "BACKEND_BASE_URL=https://opsflood-backend.up.railway.app" >> .env

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
        continue-on-error: true

  build_release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create stub .env for CI
        run: |
          echo "# CI stub .env" > .env
          echo "BACKEND_BASE_URL=https://opsflood-backend.up.railway.app" >> .env

      - name: Decode keystore from base64 secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks

      - name: Write keystore.properties from CI secrets
        run: |
          cat > android/keystore.properties << EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=equinox_bh
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=BACKEND_BASE_URL=https://opsflood-backend.up.railway.app \
            --dart-define=ADMOB_BANNER_ANDROID=${{ secrets.ADMOB_BANNER_ANDROID_PROD }} \
            --dart-define=ADMOB_INTERSTITIAL_ANDROID=${{ secrets.ADMOB_INTERSTITIAL_ANDROID_PROD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsflood-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f android/keystore.jks android/keystore.properties

  deploy_play_store:
    name: Deploy to Play Store (Internal Track)
    runs-on: ubuntu-latest
    needs: build_release
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_to_play_store == 'true'
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: opsflood-release-aab

      - name: Upload to Play Store (Internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.equinox.flood
          releaseFiles: app-release.aab
          track: internal
          status: completed
