# .github/workflows/release.yml  Step 7.2
# Triggers on version tags (v*) pushed to the repo.
# Builds a signed release APK + AAB and attaches them to a GitHub Release.
#
# Required GitHub Secrets:
#   KEYSTORE_BASE64      — base64-encoded .jks keystore file
#   KEYSTORE_PASSWORD    — store password
#   KEY_ALIAS            — key alias inside the keystore
#   KEY_PASSWORD         — key password

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.44.6'
  JAVA_VERSION:    '17'

jobs:

  build-and-release:
    name: Build Signed Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tag name

      # ── 2. Java (needed by Gradle)
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ── 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # ── 4. Dependencies + codegen
      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n + mocks
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # ── 5. Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/release.keystore

      # ── 6. Write key.properties
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # ── 7. Extract version from tag
      - name: Set version env
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.4.2
          VERSION="${TAG#v}"                 # 1.4.2
          BUILD=$(git rev-list --count HEAD) # monotonic build number
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD}"   >> $GITHUB_ENV

      # ── 8. Build APK
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }}

      # ── 9. Build AAB (for Play Store)
      - name: Build release AAB
        run: |
          flutter build appbundle --release \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ env.BUILD_NUMBER }}

      # ── 10. Rename artifacts
      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/opsflood-${{ env.APP_VERSION }}.apk
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/opsflood-${{ env.APP_VERSION }}.aab

      # ── 11. Create GitHub Release + upload assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpsFlood ${{ env.APP_VERSION }}
          body: |
            ## OpsFlood ${{ env.APP_VERSION }}

            Automated release built from tag `${{ github.ref_name }}`.
            Build number: `${{ env.BUILD_NUMBER }}`

            ### Assets
            - **APK** — direct install on Android
            - **AAB** — for Play Store submission via Fastlane (Step 7.3)
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta → prerelease
          files: |
            build/app/outputs/flutter-apk/opsflood-${{ env.APP_VERSION }}.apk
            build/app/outputs/bundle/release/opsflood-${{ env.APP_VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Clean up keystore
      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
